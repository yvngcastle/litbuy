<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@yvngcastle</title>

  <!-- Monograph Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      text-align:center;
      width:320px;
    }

    .pfp{
      width:110px;
      height:110px;
      border:1px solid #222;
      border-radius:50%;
      margin:0 auto 22px;
      overflow:hidden;
      background:#111;
    }

    .pfp img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      font-size:26px;
      font-weight:400;
      margin-bottom:26px;
      letter-spacing:.5px;
    }

    a{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:#fff;
      text-decoration:none;
      padding:12px 0;
      opacity:.65;
      transition:.2s;
      font-size:15px;
    }

    a:hover{
      opacity:1;
    }

    i{
      font-size:20px;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Replace pfp.jpg with your profile picture -->
  <div class="pfp">
    <img src="pfp.jpg" alt="Profile Picture">
  </div>

  <h1>@yvngcastle</h1>

  <a href="https://x.com/yvngcastle" target="_blank">
    <i class="ph ph-x-logo"></i>
    @yvngcastle
  </a>

  <a href="https://instagram.com/yvngcastle" target="_blank">
    <i class="ph ph-instagram-logo"></i>
    @yvngcastle
  </a>

</div>

</body>
</html>
